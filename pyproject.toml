[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "reconngan"
version = "0.1.2"
description = "Evidence-driven HTTP security reconnaissance scanner"
requires-python = ">=3.10"

dependencies = [
    "httpx",
    "rich",
]


[project.scripts]
reconngan = "reconngan.app:main"
