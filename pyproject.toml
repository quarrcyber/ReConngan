[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "reconngan"
version = "0.1.7"
description = "Evidence-driven HTTP security reconnaissance scanner"
requires-python = ">=3.10"

dependencies = [
    "httpx",
    "rich",
    "cryptography>=42",
    "dnspython>=2.6",
]


[project.scripts]
reconngan = "reconngan.app:main"
